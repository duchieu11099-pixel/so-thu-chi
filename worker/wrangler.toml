name = "so-thu-chi-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

[vars]
# Mã dự án Firebase (Project ID), xem trong Firebase console > Project settings
FIREBASE_PROJECT_ID = "so-thu-chi-ec435"
# Địa chỉ trang app được phép gọi proxy (GitHub Pages)
ALLOWED_ORIGIN = "https://so-thu-chi-ec435.firebaseapp.com,https://so-thu-chi-ec435.web.app,https://duchieu11099-pixel.github.io"
DEEPSEEK_MODEL = "deepseek-chat"

# Cron Triggers: nhắc lương ngày 15 (PanChan) và ngày 25 (lương cơ bản) lúc 12h trưa giờ Nhật
[triggers]
crons = ["0 3 15 * *", "0 3 25 * *"]

# KV namespace để lưu FCM push token
# Tạo bằng lệnh: npx wrangler kv namespace create SO_THU_CHI_KV
# Rồi thay "REPLACE_WITH_YOUR_KV_ID" bằng id trong kết quả lệnh trên
[[kv_namespaces]]
binding = "SO_THU_CHI_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# Bốn giá trị bí mật, KHÔNG ghi vào tệp này, đặt bằng lệnh:
#   npx wrangler secret put DEEPSEEK_API_KEY
#   npx wrangler secret put ALLOWED_EMAILS   (vd: email-chong@gmail.com,email-vo@gmail.com)
#   npx wrangler secret put FCM_SERVER_KEY   (Firebase console > Project settings > Cloud Messaging > Server key)
